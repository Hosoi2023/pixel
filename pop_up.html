<!-- ===== Popup de connexion PIXEL ===== -->
        <div class="login-modal" id="login-modal" aria-hidden="true" inert>
            <section class="login-window" role="dialog" aria-modal="true" aria-labelledby="login-title">
                <!-- Colonne gauche -->
                <div class="login-visual">

                    <a class="login-brand" href="index.html">
                        <span class="login-brand__logo" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                        <span>[ NOM DU BLOG ]</span>
                    </a>

                    <div class="pixel-art" id="pixel-art" aria-hidden="true"></div>

                    <p class="login-tagline">
                        BON RETOUR PARMI NOUS.<br>
                        VOTRE PROCHAIN FILM VOUS<br>
                        ATTEND.
                    </p>

                </div>

                <!-- Colonne droite -->
                <div class="login-panel">

                    <button class="login-modal__close" id="close-login" type="button" aria-label="Fermer la fenêtre de connexion" >&times;</button>

                    <div class="login-panel__inner">

                        <h2 id="login-title">CONNEXION</h2>

                        <p class="login-subtitle">
                            Connectez-vous pour commenter et noter les films.
                        </p>

                        <form action="#" method="post" id="login-form">

                            <div class="login-form__group">
                                <label for="login-email">ADRESSE E-MAIL</label>
                                <input
                                    type="email"
                                    id="login-email"
                                    name="email"
                                    placeholder="votre@email.be"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <div class="login-form__group">
                                <div class="login-password__heading">
                                    <label for="login-password">MOT DE PASSE</label>
                                    <a href="forgot-password.html">
                                        Mot de passe oublié ?
                                    </a>
                                </div>

                                <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required >
                            </div>

                            <label class="login-remember">
                                <input
                                    type="checkbox"
                                    name="remember"
                                >
                                <span>Rester connecté</span>
                            </label>

                            <button
                                class="login-submit"
                                type="submit"
                            >
                                SE CONNECTER
                            </button>

                        </form>

                        <div class="login-divider">
                            <span></span>
                            <p>OU</p>
                            <span></span>
                        </div>

                        <p class="login-register">
                            Pas encore de compte ?
                            <a href="register.html">Créer un compte</a>
                        </p>

                    </div>
                </div>
            </section>
        </div>
